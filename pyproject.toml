[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadengine"
version = "0.1.0"
description = "Lead Discovery & Enrichment Engine (strict MVP) for cybersecurity B2B prospecting using public data only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SpicyTunaa" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.2",
    "aiolimiter>=1.1",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
leadengine = "leadengine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadengine = ["../config/*.yaml", "techdetect/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # typer uses function calls in option defaults
    "UP042",  # str+Enum mixin is intentional (JSON/DB friendly stage values)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501"]
